quarkus.http.port=8080
kogito.service.url=http://localhost:8080

# Laya-Dienst (laya_kyc/laya_service.py)
quarkus.rest-client.laya.url=${LAYA_URL:http://localhost:8000}
quarkus.rest-client.laya.connect-timeout=2000
quarkus.rest-client.laya.read-timeout=30000

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=KYC-Prüfprozess

# Weboberfläche: kein Browser-Cache, damit Änderungen nach einem Neustart sofort ankommen
quarkus.http.static-resources.caching-enabled=false
quarkus.http.filter.web-ui.header."Cache-Control"=no-cache
quarkus.http.filter.web-ui.matches=/(index\\.html|app\\.js|app\\.css)?
